syntax = "proto3";

package telemetry.messages;

option java_package = "ru.yandex.practicum.grpc.telemetry.collector";
option java_multiple_files = true;

import "telemetry/services/hub_router_controller.proto";
import "google/protobuf/timestamp.proto";

// Типы устройств
// Типы устройств (полностью соответствует DeviceTypeAvro)
enum DeviceTypeProto {
  MOTION_SENSOR = 0;
  TEMPERATURE_SENSOR = 1;
  LIGHT_SENSOR = 2;
  CLIMATE_SENSOR = 3;
  SWITCH_SENSOR = 4;
}

// Типы условий (полностью соответствует ConditionTypeAvro)
enum ConditionTypeProto {
  MOTION = 0;
  LUMINOSITY = 1;
  SWITCH = 2;
  TEMPERATURE = 3;
  CO2LEVEL = 4;
  HUMIDITY = 5;
}

// Операции сравнения (полностью соответствует ConditionOperationAvro)
enum ConditionOperationProto {
  EQUALS = 0;
  GREATER_THAN = 1;
  LOWER_THAN = 2;
}

// Событие: добавление устройства
message DeviceAddedEventProto {
  string id = 1;
  DeviceTypeProto type = 2;  // переименовал с device_type на type как в Avro
}

// Событие: удаление устройства
message DeviceRemovedEventProto {
  string id = 1;
}

// Условие сценария (теперь с union типами для value)
message ScenarioConditionProto {
  string sensor_id = 1 [json_name = "sensor_id"];
  ConditionTypeProto type = 2 [json_name = "type"];
  ConditionOperationProto operation = 3 [json_name = "operation"];
  optional int32 value = 4 [json_name = "value"];
}

// Событие: добавление сценария
message ScenarioAddedEventProto {
  string name = 1;
  repeated ScenarioConditionProto conditions = 2;
  repeated telemetry.service.hubrouter.DeviceActionProto actions = 3;
}

// Событие: удаление сценария
message ScenarioRemovedEventProto {
  string name = 1;
}

// Основное сообщение события хаба
message HubEventProto {
  string hub_id = 1;
  google.protobuf.Timestamp timestamp = 2;

  oneof payload {
    DeviceAddedEventProto device_added = 3;
    DeviceRemovedEventProto device_removed = 4;
    ScenarioAddedEventProto scenario_added = 5;
    ScenarioRemovedEventProto scenario_removed = 6;
  }
}

